name: Build Ghiyas Offline Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    # اضافه شدن تریگر برای تگ‌های نسخه (مثلاً v1.0.0 یا v1.1.2)
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    # این دسترسی برای ایجاد اتوماتیک صفحه Release در گیت‌هاب الزامی است
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build Web App (Compile KMP JS)
        run: ./gradlew :webApp:jsBrowserDistribution

      - name: Inject Web Files into Android Assets
        run: |
          mkdir -p androidApp/src/main/assets
          cp -R webApp/build/dist/js/productionExecutable/* androidApp/src/main/assets/

      - name: Build Android APK (Release)
        run: ./gradlew :androidApp:assembleRelease

      - name: Sign APK with Keystore
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: androidApp/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.GHIYAS_KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Signed Ghiyas APK (Artifact)
        uses: actions/upload-artifact@v5
        with:
          name: ghiyas-android-signed-apk
          path: ${{steps.sign_app.outputs.signedReleaseFile}}

      # مرحله جدید: انتشار در GitHub Releases (فقط در صورت وجود تگ نسخه)
      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{steps.sign_app.outputs.signedReleaseFile}}
          # این گزینه به طور خودکار لاگ کامیت‌ها را به عنوان توضیحات آپدیت می‌نویسد
          generate_release_notes: true
