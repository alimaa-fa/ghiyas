name: Build Ghiyas Offline Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build Web App (Compile KMP JS)
        # کامپایل ماژول وب بر پایه DOM خالص جاوااسکریپت
        run: ./gradlew :webApp:jsBrowserDistribution

      - name: Inject Web Files into Android Assets
        # تزریق خروجی وب آفلاین به پوشه دارایی‌های اندروید جهت استفاده در WebView
        run: |
          mkdir -p androidApp/src/main/assets
          cp -R webApp/build/dist/js/productionExecutable/* androidApp/src/main/assets/

      - name: Accept Android Licenses & Pre-install SDK 36
        # تأیید الزامی لایسنس‌ها و نصب بستر API 36 پیش از بیلد تا سرور ابری متوقف نشود
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build Android APK (Release)
        run: ./gradlew :androidApp:assembleRelease

      - name: Sign APK with Keystore
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: androidApp/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.GHIYAS_KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename Signed APK to Clean Name
        run: |
          mv ${{ steps.sign_app.outputs.signedReleaseFile }} androidApp/build/outputs/apk/release/ghiyas-release.apk

      - name: Upload Signed Ghiyas APK (Artifact)
        uses: actions/upload-artifact@v5
        with:
          name: ghiyas-android-signed-apk
          path: androidApp/build/outputs/apk/release/ghiyas-release.apk

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: androidApp/build/outputs/apk/release/ghiyas-release.apk
          generate_release_notes: true
