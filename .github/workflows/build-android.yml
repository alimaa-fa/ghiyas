name: Build Ghiyas Offline Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build Web App (Compile KMP JS)
        run: ./gradlew :webApp:jsBrowserDistribution

      - name: Inject Web Files into Android Assets
        run: |
          mkdir -p androidApp/src/main/assets
          cp -R webApp/build/dist/js/productionExecutable/* androidApp/src/main/assets/

      - name: Accept Android Licenses & Pre-install SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build Android APK (Release)
        run: ./gradlew :androidApp:assembleRelease

      - name: Align, Sign, and Verify APK using Native Build-Tools 36
        env:
          KEYSTORE_BASE64: ${{ secrets.GHIYAS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # پاکسازی تضمینی کلید در صورت بروز هرگونه خطا یا توقف پایپ‌لاین
          trap 'rm -f release.keystore aligned.apk' EXIT
          
          # بازیابی کلید امضا از متغیرهای امنیتی مخزن
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          
          # شناسایی دقیق فایل خروجی خام مرحله کامپایل
          RAW_APK=$(find androidApp/build/outputs/apk/release -name "*.apk" ! -name "*-signed.apk" | head -n 1)
          
          # اجرای تراز بهینه حافظه نسخه ۳۶ با استاندارد چینش ۴ بایت
          $ANDROID_HOME/build-tools/36.0.0/zipalign -v -p 4 "$RAW_APK" aligned.apk
          
          # امضای رسمی با استانداردهای امنیتی v2/v3/v4 گوگل
          $ANDROID_HOME/build-tools/36.0.0/apksigner sign --ks release.keystore \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass pass:"$KEY_PASSWORD" \
            --out androidApp/build/outputs/apk/release/ghiyas-release.apk aligned.apk

          # اعتبارسنجی رسمی ساختار و صحت امضای بسته
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose androidApp/build/outputs/apk/release/ghiyas-release.apk

      - name: Upload Signed Ghiyas APK (Artifact)
        uses: actions/upload-artifact@v5
        with:
          name: ghiyas-android-signed-apk
          path: androidApp/build/outputs/apk/release/ghiyas-release.apk
          retention-days: 30

      - name: Publish to GitHub Releases (Native GitHub CLI)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            androidApp/build/outputs/apk/release/ghiyas-release.apk \
            --title "نسخه ${{ github.ref_name }}" \
            --generate-notes
